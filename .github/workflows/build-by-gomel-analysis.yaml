name: Build geospatial by-gomel-analysis
on:
  pull_request:
    paths:
      - .github/workflows/build-by-gomel-analysis.yaml
      - geospatial/by-gomel-analysis/**
    types:
      - opened
      - reopened
      - synchronize

env:
  JAVA_VERSION: 25
  JDK_VENDOR: corretto

jobs:
  build:
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout code
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        # https://github.com/marketplace/actions/setup-java-jdk
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        # https://github.com/marketplace/actions/build-with-gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build app
        shell: bash
        run: ./gradlew -p geospatial/by-gomel-analysis clean build
