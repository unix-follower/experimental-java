plugins {
    id "application"
    id "java"
    id "jacoco"
    id "pmd"
    id "checkstyle"
    id("me.champeau.jmh") version "0.7.3"
}

group = 'org.example.experiments.math'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation "org.slf4j:slf4j-api:${slf4jApiVersion}"
    // Source: https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    implementation "ch.qos.logback:logback-classic:${logbackClassicVersion}"
    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-math3
    implementation "org.apache.commons:commons-math3:${commonsMath3Version}"
    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    // Source: https://mvnrepository.com/artifact/org.openjdk.jmh/jmh-core
    jmhImplementation("org.openjdk.jmh:jmh-core:${jmhVersion}")
    // Source: https://mvnrepository.com/artifact/org.openjdk.jmh/jmh-generator-annprocess
    jmhImplementation("org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}")
    // Source: https://mvnrepository.com/artifact/org.junit/junit-bom
    testImplementation(platform("org.junit:junit-bom:${junitBomVersion}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

application {
    mainClass = 'org.example.experiments.math.ExampleApp'
}

tasks.jar {
    manifest {
        attributes(
                "Main-Class": "org.example.experiments.math.ExampleApp",
                "Build-Jdk-Spec": java.sourceCompatibility,
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Class-Path": configurations.runtimeClasspath.files
                        .collect() { "lib/" + it.name },
        )
    }
}

tasks.register("sourceJar", Jar) {
    description = "Compile all source files and create jar file"
    group = LifecycleBasePlugin.BUILD_GROUP

    dependsOn("classes")
    archiveFileName.set("${project.name}-sources.jar")
    from(sourceSets.main.allSource)
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/lib')
}

pmd {
    ignoreFailures = false
    ruleSets = [] // Disable default rulesets
    ruleSetFiles = files("../config/pmd-ruleset.xml")
}

checkstyle {
    configFile = file("../config/checkstyle.xml")
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }

        rule {
            enabled = false
            element = "CLASS"

            limit {
                counter = "LINE"
                value = "TOTALCOUNT"
                maximum = 0.8
            }
        }
    }
}

tasks.named("test") {
    useJUnitPlatform {
        final String junitTags = System.getProperty("junit-tags")
        if (junitTags != null && junitTags.isNotBlank()) {
            includeTags(junitTags)
        }

        final String junitExcludeTags = System.getProperty("junit-exclude-tags")
        if (junitExcludeTags != null && junitExcludeTags.isNotBlank()) {
            excludeTags(junitExcludeTags)
        }
    }
}

test {
    finalizedBy jacocoTestReport
}

tasks.withType(Pmd) {
    reports {
        xml.required = true
        html.required = true
        maxFailures = 1
    }
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = true
        html.required = true
        maxWarnings = 1
        maxErrors = 1
    }
    exclude '**/module-info.java'
}

jmh {
    this.version(jmhVersion)
    fork.set(1)
    threads.set(2)
    warmup.set("1s")
    warmupIterations.set(2)
    iterations.set(2)
    timeOnIteration.set("1s")
    timeUnit.set("ms")
    benchmarkMode.set(Set.of("all"))
}
